[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.coverage.run]
source = ["backend"]
branch = true
omit = ["backend/tests/*", "backend/worker_main.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
