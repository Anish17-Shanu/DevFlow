name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend dependencies (hashed lock)
        run: pip install --require-hashes -r backend/requirements-dev.lock
      - name: Verify dependency consistency
        run: pip check
      - name: Lint backend
        run: ruff check backend migrations
      - name: Check formatting
        run: ruff format --check backend migrations
      - name: Run backend tests with coverage
        run: python -m pytest --cov=backend --cov-report=term --cov-report=xml
      - name: Check API docs match the OpenAPI schema
        if: matrix.python-version == '3.12'
        run: python scripts/generate_api_docs.py --check
      - name: Upload coverage
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow
          POSTGRES_DB: devflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEVFLOW_DATABASE_URL: postgresql+asyncpg://devflow:devflow@127.0.0.1:5432/devflow
      DEVFLOW_TEST_POSTGRES_URL: postgresql+asyncpg://devflow:devflow@127.0.0.1:5432/devflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend dependencies (hashed lock)
        run: pip install --require-hashes -r backend/requirements-dev.lock
      - name: Verify migrations apply cleanly on Postgres
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run Postgres integration and full test suite
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests with coverage
        run: npm run test:coverage
      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHON_BIN: python
      DEVFLOW_E2E_BACKEND_PORT: "8010"
      DEVFLOW_E2E_FRONTEND_PORT: "5175"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies (hashed lock)
        run: pip install --require-hashes -r backend/requirements.lock
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run end-to-end tests
        run: npx playwright test
        working-directory: frontend
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: devflow-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: devflow-frontend:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: devflow-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: devflow-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: spdx-json
          artifact-name: devflow-sbom.spdx.json
          upload-artifact: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker, postgres, e2e]
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign images (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
          cosign sign --yes ghcr.io/${{ github.repository }}/web:${{ github.ref_name }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
