# Example only. Do not commit real values.
# In production use External Secrets, Sealed Secrets, or your cloud secret manager.
#   kubectl create secret generic devflow-secrets -n devflow \
#     --from-literal=DEVFLOW_BOOTSTRAP_API_KEY=... \
#     --from-literal=DEVFLOW_SECRET_ENCRYPTION_KEY=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=DEVFLOW_DATABASE_URL='postgresql+asyncpg://devflow:...@postgres:5432/devflow'
apiVersion: v1
kind: Secret
metadata:
  name: devflow-secrets
type: Opaque
stringData:
  DEVFLOW_BOOTSTRAP_API_KEY: replace-with-a-unique-key-of-24-plus-characters
  DEVFLOW_SECRET_ENCRYPTION_KEY: replace-with-a-fernet-key
  POSTGRES_PASSWORD: replace-with-a-strong-password
  DEVFLOW_DATABASE_URL: postgresql+asyncpg://devflow:replace-me@postgres:5432/devflow
