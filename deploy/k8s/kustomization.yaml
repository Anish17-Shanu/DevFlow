apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devflow

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml
  - networkpolicy.yaml

images:
  - name: devflow-api
    newName: ghcr.io/anish17-shanu/devflow/api
    newTag: "2.0.0"
  - name: devflow-web
    newName: ghcr.io/anish17-shanu/devflow/web
    newTag: "2.0.0"

labels:
  - pairs:
      app.kubernetes.io/part-of: devflow
