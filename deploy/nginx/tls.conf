# TLS reverse proxy for a single-host deployment.
# Mount certificates (for example from certbot) at /etc/letsencrypt and put this
# file in /etc/nginx/conf.d/. Terminates TLS and forwards to the frontend
# container, which proxies /api and /ws to the API service.

upstream devflow_web {
  server web:8080;
  keepalive 16;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  server_name devflow.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name devflow.example.com;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/devflow.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/devflow.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  client_max_body_size 1m;

  location /ws/ {
    proxy_pass http://devflow_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://devflow_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
